apiVersion: apps/v1
kind: Deployment
metadata:
  name: federated-coordinator
  namespace: default
  labels:
    app: federated-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: federated-coordinator
  template:
    metadata:
      labels:
        app: federated-coordinator
    spec:
      containers:
        - name: federated-coordinator
          image: federated-learning:latest
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: MIN_NODES_REQUIRED
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: MIN_NODES_REQUIRED
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-node-alpha
  namespace: default
  labels:
    app: hospital-node-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-node-alpha
  template:
    metadata:
      labels:
        app: hospital-node-alpha
    spec:
      containers:
        - name: hospital-node-alpha
          image: federated-learning:latest
          command: ["python", "client_node.py"]
          env:
            - name: COORDINATOR_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: COORDINATOR_URL
            - name: NODE_ID
              value: "hospital-node-alpha"
            - name: NODE_NAME
              value: "Hospital Node Alpha"
            - name: HOSPITAL_LOCATION
              value: "Boston Medical Center"
            - name: IP_ADDRESS
              value: "192.168.42.101"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
