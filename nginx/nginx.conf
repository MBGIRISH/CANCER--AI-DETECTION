user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging config
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting zone: 10 requests/sec limit per IP address
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    # Upstream backend architectures
    upstream frontend_svc {
        server frontend:80;
    }

    upstream backend_svc {
        server backend:8000;
    }

    upstream ai_inference_svc {
        server ai-inference:8001;
    }

    upstream federated_svc {
        server federated-coordinator:8004;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Max file upload size for high-resolution medical scans (up to 32MB)
        client_max_body_size 32M;

        # GZIP Compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Security Headers (HIPAA & Production Compliant)
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Frontend Static Files
        location / {
            proxy_pass http://frontend_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Authentication Routes Proxy
        location /api/auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_svc/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reports and Registry Routes Proxy
        location /api/reports {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://backend_svc/api/reports;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI Prediction / Inference Routes Proxy
        location /api/predict {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://ai_inference_svc/predict;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for large images response
            proxy_buffering off;
        }

        # Federated Learning Coordinator routes
        location /api/federated/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://federated_svc/api/federated/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health Checks
        location /healthz {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }
    }
}
