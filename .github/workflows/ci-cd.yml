name: OncoSight Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Lint, unit test and compilation test
  test-and-lint:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Python Backend setup & test
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Lint Python Code
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Node Frontend setup & compilation test
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

  # Job 2: Security & Vulnerability Scanning
  security-audit:
    name: Trivy Security Audit
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner on codebase
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

  # Job 3: Multi-Stage Docker Builds (Simulation of Registry Publish)
  docker-build:
    name: Build Production Docker Images
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build NGINX Gateway Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/nginx.Dockerfile
          push: false
          tags: oncosight/nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Webapp Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: oncosight/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API Backend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: oncosight/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Inference Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/ai-inference.Dockerfile
          push: false
          tags: oncosight/ai-inference:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 4: Kubernetes Manifests Validation
  k8s-validate:
    name: Kubernetes Manifests Dry-Run
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'

      - name: Validate Kubernetes Manifests Syntax (Dry-Run)
        run: |
          # Dry run check on deployments and services
          kubectl apply --dry-run=client -f k8s/secrets.yaml
          kubectl apply --dry-run=client -f k8s/configmaps.yaml
          kubectl apply --dry-run=client -f k8s/mongodb-deployment.yaml
          kubectl apply --dry-run=client -f k8s/services.yaml
          kubectl apply --dry-run=client -f k8s/ai-inference-deployment.yaml
          kubectl apply --dry-run=client -f k8s/backend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/frontend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/federated-deployment.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml
          kubectl apply --dry-run=client -f k8s/hpa.yaml
